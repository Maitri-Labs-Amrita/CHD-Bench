[project]
name = "chd-bench"
version = "0.1.0"
description = "Evaluate vision-language models as 3D Slicer agents that diagnose congenital heart disease from cardiac CT and MRI"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.14"
dependencies = [
    "anthropic>=1.9.0",
    "fastapi>=0.110",
    "httpx>=0.27",
    "mcp==2.2.0",
    "numpy>=1.26",
    "pillow>=10",
    "openai>=3.22.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "reportlab>=5.0.1",
    "simpleitk>=2.4",
    "slicer-mcp",
    "uvicorn>=0.29",
    "wandb>=0.19",
]

[project.optional-dependencies]
transformers = ["torch>=2.2", "torchvision", "transformers>=4.49", "pillow>=10", "accelerate>=0.30"]

[project.scripts]
run-episode = "chd_client.run_episode:main"
episode-report = "chd_client.report_pdf:main"
rescore = "chd_client.run_folder:rescore_main"
chd-slicer = "chd_client.slicer:main"
chd-gateway = "chd_client.gateway.cli:main"

[dependency-groups]
analysis = [
    "scikit-learn>=1.7.2",
]
dev = [
    "httpx>=0.28.1",
    "pypdfium2>=5.13.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chd_client"]

[tool.uv.sources]
slicer-mcp = { path = "../slicer-eval-mcp", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slicer: needs a live slicer-mcp bridge with the chd_ct_v1 profile (chd-slicer launch)"]
addopts = "-m 'not slicer'"
asyncio_mode = "auto"
